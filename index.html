body{display:grid;place-items:center;background:#e8e7e2;font:13px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1c1b1f}

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const SK='gridlab.key';
async function run(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},key,u8(P.c));
  return new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
function show(html){document.open();document.write(html);document.close();}
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
(async()=>{
  if(!window.crypto||!crypto.subtle){document.getElementById('m').textContent='This browser cannot decrypt the app (needs https).';return;}
  const saved=sessionStorage.getItem(SK);
  if(saved){try{const k=await crypto.subtle.importKey('raw',u8(saved),'AES-GCM',true,['decrypt']);show(await run(k));return;}catch(e){sessionStorage.removeItem(SK);}}
  document.getElementById('f').onsubmit=async e=>{
    e.preventDefault();const b=document.getElementById('b'),m=document.getElementById('m');b.disabled=true;m.textContent='';b.textContent='Unlocking…';
    try{const k=await derive(document.getElementById('p').value);const html=await run(k);
      try{const raw=new Uint8Array(await crypto.subtle.exportKey('raw',k));sessionStorage.setItem(SK,btoa(String.fromCharCode(...raw)));}catch(_){}
      show(html);}
    catch(err){m.textContent='Wrong password';b.disabled=false;b.textContent='Unlock';}
  };
})();
</script>
